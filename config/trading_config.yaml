  demo_unified:
    created_at: '2025-05-30T21:38:40.664480+00:00'
    id: demo_unified
    indicators:
      RSI_14:
        parameters:
          period: 14
        source: close
        type: RSI
      SMA_10:
        parameters:
          period: 10
        source: close
        type: SMA
      SMA_30:
        parameters:
          period: 30
        source: close
        type: SMA
    name: Demo Unified Strategy
    parameters:
      long_window: 30
      short_window: 10
    signal_rules:
      long_condition: SMA_10 > SMA_30 & SMA_10[-1] <= SMA_30[-1] & RSI_14 < 70
      short_condition: SMA_10 < SMA_30 & SMA_10[-1] >= SMA_30[-1] & RSI_14 > 30
    status: configured
    symbol: BTCUSD
    timeframe: 5m
    workflow_enabled: true
